name: sandbox
version: 1.0.0
description: "Pi coding sessions in a Gondolin microVM (hermes-sandbox): the repository goes in and Pi's branch comes out as git bundles, reviewed before anything from it runs here."
author: "personal-server-nixconfig"
provides_tools:
  - sandbox_run
  - sandbox_status
  - sandbox_result
  - sandbox_stop
  - sandbox_grants
  - sandbox_revoke
